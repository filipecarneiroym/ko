[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/ko-supervisord.pid

[program:apache]
command=/usr/local/bin/apache2-foreground
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:relay]
command=/usr/local/bin/php /var/www/ko/laravel/artisan ko:relay
directory=/var/www/ko/laravel
user=www-data
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
