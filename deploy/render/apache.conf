<VirtualHost *:10000>
    DocumentRoot /var/www/ko/public
    <Directory /var/www/ko/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    ProxyPreserveHost On
    ProxyPass "/ws" "ws://127.0.0.1:6001/"
    ProxyPassReverse "/ws" "ws://127.0.0.1:6001/"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
