# Nginx do K.O — copie para /etc/nginx/sites-available/ko e troque SEUDOMINIO.
# O site (Laravel) sai de /var/www/ko/public e o relay da luta fica em /ws (WebSocket).
server {
    listen 80;
    server_name SEUDOMINIO;
    root /var/www/ko/public;
    index index.php;

    add_header X-Content-Type-Options nosniff;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Relay da luta: o navegador abre wss://SEUDOMINIO/ws e o Nginx repassa para o ko:relay.
    location /ws {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;  # o jogo manda sinal de vida a cada segundo
    }

    # sw.js e manifest sem cache longo (senão o app instalado demora a atualizar).
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.(?:js|css|png|webmanifest)$ { expires 30d; access_log off; try_files $uri =404; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
